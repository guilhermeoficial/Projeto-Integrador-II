name: CI - Sistema de Reservas

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  testes:
    name: Rodar Testes Automatizados
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reservas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: backend
        run: npm install

      - name: Criar tabelas no banco de teste
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d reservas_test -f database/banco_de_dados.sql

      - name: Rodar testes
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/reservas_test
          JWT_SECRET: chave_secreta_para_testes_ci
          PORT: 3000
        run: npx jest --forceExit --testTimeout=10000
